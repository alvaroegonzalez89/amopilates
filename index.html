<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMO Pilates</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{--ar:#C0A890;--cr:#F3EBDD;--na:#003048;--az:#7F93B0}
*{box-sizing:border-box;margin:0}
body{background:var(--cr);color:var(--na);font:400 15px Jost,sans-serif;min-height:100vh}
h1,h2,.sc{font-family:'Kaushan Script',cursive;font-weight:400}
.logo{width:140px;mix-blend-mode:multiply}
.wrap{max-width:1000px;margin:auto;padding:16px}.c{text-align:center}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #c0a89040;margin-bottom:14px}
input,select{width:100%;padding:11px;border:1px solid var(--ar);border-radius:10px;background:var(--cr);font:inherit;color:var(--na);margin:5px 0}
button{font:500 14px Jost;border:0;border-radius:22px;padding:10px 18px;background:var(--na);color:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 14px #00304840}
button.s{background:var(--ar)}button.x{background:none;color:var(--az);padding:2px 8px;box-shadow:none}
.sede{position:relative;width:210px;height:210px;display:inline-block;margin:10px;cursor:pointer;transition:transform .5s}
.sede:hover{transform:rotate(10deg) scale(1.05)}
.sede svg{position:absolute;inset:0}.sede div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 22px 'Kaushan Script'}
.sede small{font:400 12px Jost;color:var(--az)}
circle{fill:none;stroke:var(--ar);stroke-width:5;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:d 1.8s ease forwards}
circle+circle{stroke:var(--na);stroke-width:2;animation-delay:.35s}
@keyframes d{to{stroke-dashoffset:0}}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.tabs button{background:#fff;color:var(--na);margin:2px}.tabs button.on{background:var(--na);color:#fff}
.sc-w{overflow-x:auto}.g{display:grid;grid-template-columns:52px repeat(5,minmax(96px,1fr));min-width:600px;border:1px solid var(--ar);border-radius:12px;overflow:hidden;background:#fff}
.g>div{padding:7px 4px;border:.5px solid #ece3d6;text-align:center;font-size:12px;min-height:48px}
.g .h{background:var(--cr);font-weight:600}.g .t{font:400 17px 'Kaushan Script';color:var(--az)}
.cl{cursor:pointer}.cl:hover{background:var(--cr)}.p{opacity:.35}
.b{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--cr)}.b.f{background:#e9c9c0}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ddd;margin:1px}.dots i.o{background:var(--na)}
dialog{border:0;border-radius:16px;padding:20px;max-width:420px;width:92%;color:var(--na)}dialog::backdrop{background:#00304855}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--cr);gap:8px}
</style></head><body><div class="wrap" id="app"></div><dialog id="dl"></dialog>

const btn=pas?"":mia?`<button class="s" onclick="run(cancelar('${mia.id}'))">Cancelar</button>`:rs.length>=CUPO?`<span class="b f">Lleno</span>`:`<button onclick="anotar('${F}','${hk}')">+ Anotarme</button>`;
h+=`<div class="${pas?"p":""}">${dots}${btn}</div>`})});return `<div class="sc-w">${h}</div></div>`.replace(/<\/div><\/div>$/,"</div></div>")}
function semNav(){const L=lunes(W);return `<div class="top" style="margin:10px 0"><button class="s" onclick="W=Math.max(0,W-1);paint()">‹</button><span class="sc" style="font-size:18px">Semana del ${L.getDate()} de ${MES[L.getMonth()]}</span><button class="s" onclick="W=Math.min(${ag?2:12},W+1);paint()">›</button></div>`}
function paint(){if(!S)return;if(ag!==null&&!au.currentUser){if(window._al)paintPub();return}
const sd=SEDES[S];let b="";
if(T=="agenda")b=`<div class="top"><span></span><button class="s" onclick="mes()">Cargar turnos fijos del mes</button></div>`+semNav()+grid(1);
if(T=="alumnos")b=`<div class="top"><h2>Alumnos (${alum.filter(a=>a.activo).length})</h2><button onclick="fAlum()">+ Nuevo</button></div><div class="card">`+alum.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(a=>`<div class="row"><div><b>${esc(a.nombre)}</b><br><small>DNI ${esc(a.dni)} · ${a.plan} clases/sem · ${esc(a.telefono)}</small></div><div><button class="x" onclick="fAlum('${a.id}')">Editar</button><button class="x" onclick="baja('${a.id}')">Borrar</button></div></div>`).join("")+`</div>`;
if(T=="cuotas")b=cuotasHtml();
if(T=="insc")b=`<h2>Inscripciones</h2><div class="card">Link para compartir: <small>${location.origin+location.pathname}?inscripcion=1&sede=${S}</small></div><div class="card">`+(pros.filter(p=>p.estado=="nuevo").map(p=>`<div class="row"><div><b>${esc(p.nombre)}</b> <span class="b">${p.plan=="P"?"Clase de prueba":p.plan+" clases/sem"}</span><br><small>${esc(p.telefono)} · DNI ${esc(p.dni)}<br>${(p.horarios||[]).map(esc).join(", ")}</small></div><div><button onclick="conf('${p.id}')">Confirmar</button><button class="x" onclick="db.collection('amo_prospectos').doc('${p.id}').delete()">✕</button></div></div>`).join("")||"Sin inscripciones nuevas")+`</div>`;
if(T=="agenda")b+=`<div class="card">Link agenda alumnos: <small>${location.origin+location.pathname}?agenda=1&sede=${S}</small></div>`;
$("app").innerHTML=`<div class="top"><img class="logo" style="width:80px" src="${LOGO}"><div class="c"><h2 style="font-size:22px">${sd.n}</h2></div><div><button class="s" onclick="S=null;un.forEach(f=>f());home()">⟲ Cambiar sucursal</button> <button class="x" onclick="au.signOut()">Salir</button></div></div><div class="tabs">${[["agenda","Agenda"],["alumnos","Alumnos"],["cuotas","Cuotas"],["insc","Inscripciones"+(pros.filter(p=>p.estado=="nuevo").length?" ●":"")]].map(([k,n])=>`<button class="${T==k?"on":""}" onclick="T='${k}';paint()">${n}</button>`).join("")}</div><div style="margin-top:12px">${b}</div>`}
function home(){$("app").innerHTML=head("Bienvenida","Elegí la sucursal")+sedeCards("elegir")}
window.elegir=k=>{S=k;W=0;T="agenda";alum=[];res=[];pros=[];listen();paint()};
function celda(F,hk){const rs=res.filter(r=>r.fecha==F&&r.horario==hk);$("dl").innerHTML=`<h2>${hk} · ${F}</h2>`+rs.map(r=>`<div class="row">${esc(r.alumnoNombre)}<button class="x" onclick="run(cancelar('${r.id}'))">✕</button></div>`).join("")+`<select id="sa">${alum.filter(a=>a.activo).map(a=>`<option value="${a.id}">${esc(a.nombre)}</option>`).join("")}</select><div class="top"><button onclick="run(reservar(S,'${F}','${hk}',alum.find(a=>a.id==$('sa').value)))">Agregar</button><button class="s" onclick="$('dl').close()">Cerrar</button></div>`;$("dl").showModal()}
function fAlum(id){const a=alum.find(x=>x.id==id)||{plan:2,horarios:[]};$("dl").innerHTML=`<h2>${id?"Editar":"Nuevo"} alumno</h2><input id="fn" placeholder="Nombre" value="${esc(a.nombre)}"><input id="fd" placeholder="DNI" value="${esc(a.dni)}"><input id="ft" placeholder="Teléfono" value="${esc(a.telefono)}"><select id="fp"><option value="2" ${a.plan==2?"selected":""}>2 clases/sem</option><option value="3" ${a.plan==3?"selected":""}>3 clases/sem</option></select><select id="fh" multiple size="6">${slots(S).map(s=>`<option ${a.horarios.includes(s)?"selected":""}>${s}</option>`).join("")}</select><small>Horarios fijos (Ctrl/⌘ para elegir varios)</small><div class="top"><button onclick="run(gAlum('${id||""}'))">Guardar</button><button class="s" onclick="$('dl').close()">Cerrar</button></div>`;$("dl").showModal()}
async function gAlum(id){const n=$("fn").value.trim();if(!n)throw"Falta el nombre";const d={nombre:n,dni:$("fd").value.replace(/\D/g,""),telefono:$("ft").value.trim(),plan:+$("fp").value,horarios:[...$("fh").selectedOptions].map(o=>o.value),activo:true,sucursal:S,uid:OWNER};
const r=id?db.collection("amo_alumnos").doc(id):db.collection("amo_alumnos").doc();await r.set(d,{merge:true});await db.collection("amo_pub_alumnos").doc(r.id).set({nombre:d.nombre,dni:d.dni,plan:d.plan,sucursal:S,uid:OWNER});$("dl").close()}
async function baja(id){if(!confirm("¿Borrar alumno?"))return;await db.collection("amo_alumnos").doc(id).delete();await db.collection("amo_pub_alumnos").doc(id).delete()}
async function conf(id){const p=pros.find(x=>x.id==id),r=db.collection("amo_alumnos").doc(),pl=p.plan=="P"?2:+p.plan;
await r.set({nombre:p.nombre,dni:p.dni,telefono:p.telefono,plan:pl,horarios:p.plan=="P"?[]:p.horarios,activo:true,sucursal:S,uid:OWNER});await db.collection("amo_pub_alumnos").doc(r.id).set({nombre:p.nombre,dni:p.dni,plan:pl,sucursal:S,uid:OWNER});await db.collection("amo_prospectos").doc(id).update({estado:"confirmado"})}
async function mes(){if(!confirm("¿Cargar los turnos fijos de todos los alumnos hasta fin de mes?"))return;const hoy=new Date();hoy.setHours(0,0,0,0);let n=0;
for(const a of alum.filter(x=>x.activo))for(const hk of a.horarios||[])for(let d=new Date(hoy);d.getMonth()==hoy.getMonth();d.setDate(d.getDate()+1)){if(DIAS[(d.getDay()+6)%7]!=hk.split(" ")[0])continue;try{await reservar(S,fk(d),hk,a);n++}catch(e){}}alert(n+" turnos cargados")}

/* ---- CUOTAS ---- */
const mk=()=>{const h=new Date(),d=new Date(h.getFullYear(),h.getMonth()+CM,1);return{k:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),n:MES[d.getMonth()]+" "+d.getFullYear()}};
const wa=(t,m)=>window.open("https://wa.me/549"+String(t||"").replace(/\D/g,"").replace(/^0+/,"")+"?text="+encodeURIComponent(m));
const monto=(a,k)=>(a.cuotas||{})[k]?a.cuotas[k].monto:SEDES[S].pl[a.plan];
function cuotasHtml(){const m=mk(),act=CM==0,L=alum.filter(a=>a.activo).sort((a,b)=>a.nombre.localeCompare(b.nombre)),pend=L.filter(a=>!(a.cuotas||{})[m.k]);
return `<div class="top"><button class="s" onclick="CM--;paint()">‹</button><span class="sc" style="font-size:20px">${m.n} ${act?"":"🔒"}</span><button class="s" onclick="CM++;paint()">›</button></div><div class="top" style="margin:10px 0"><span><span class="b">Pagaron ${L.length-pend.length}</span> <span class="b f">Pendientes ${pend.length}</span></span><span><button class="s" onclick="fCobro()">Datos de cobro</button> ${act&&pend.length?`<button onclick="recordar()">Recordar a pendientes</button>`:""}</span></div><div class="card">`+L.map(a=>{const c=(a.cuotas||{})[m.k];return `<div class="row"><div><b>${esc(a.nombre)}</b><br><small>${a.plan} clases/sem · ${$$(monto(a,m.k))}</small></div><div>${c?`<button class="s" ${act?`onclick="run(pagar('${a.id}',0))"`:"disabled"}>✓ Pagó</button><button class="x" onclick="comp('${a.id}')">Comprobante</button>`:`<button ${act?`onclick="run(pagar('${a.id}',1))"`:"disabled"}>Cobrar</button><button class="x" onclick="transf('${a.id}')">Transferencia</button>`}</div></div>`}).join("")+`</div>`}
async function pagar(id,on){const m=mk(),r=db.collection("amo_alumnos").doc(id),a=alum.find(x=>x.id==id);
if(!on){if(!confirm("¿Marcar como pendiente?"))return;return r.update({["cuotas."+m.k]:firebase.firestore.FieldValue.delete()})}
const v=prompt("Monto cobrado",SEDES[S].pl[a.plan]);if(v===null||isNaN(+v))return;await r.update({["cuotas."+m.k]:{monto:+v,fecha:fk(new Date())}});
if(confirm("¿Enviar comprobante por WhatsApp?"))wa(a.telefono,msgComp(a,+v,m))}
const msgComp=(a,v,m)=>`Hola ${a.nombre}! 🤍 Recibimos tu pago de ${$$(v)} correspondiente a ${m.n} (AMO Pilates, ${SEDES[S].n}). ¡Gracias!`;
function comp(id){const a=alum.find(x=>x.id==id),m=mk();wa(a.telefono,msgComp(a,monto(a,m.k),m))}
function transf(id){const a=alum.find(x=>x.id==id),m=mk();if(!cfg.alias&&!cfg.cbu)return alert("Primero cargá los datos de cobro.");
wa(a.telefono,`Hola ${a.nombre}! 🤍 Tu cuota de ${m.n} en AMO Pilates es de ${$$(monto(a,m.k))}.\nPodés transferir a:\n🏦 ${cfg.banco||""}\n💳 Alias: ${cfg.alias||""}\n💳 CBU: ${cfg.cbu||""}\n👤 Titular: ${cfg.titular||""}\nCuando lo hagas, mandanos el comprobante 🙏`)}
function recordar(){const m=mk(),P=alum.filter(a=>a.activo&&!(a.cuotas||{})[m.k]);
$("dl").innerHTML=`<h2>Recordatorios · ${m.n}</h2>`+P.map(a=>`<div class="row">${esc(a.nombre)}<button onclick="wa('${esc(a.telefono)}',decodeURIComponent('${encodeURIComponent(`Hola ${a.nombre}! 🤍 Te recordamos que la cuota de ${m.n} de AMO Pilates (${$$(monto(a,m.k))}) está pendiente. Si ya pagaste, ¡avisanos! Gracias.`)}'));this.textContent='Enviado ✓'">Enviar</button></div>`).join("")+`<div class="top"><span></span><button class="s" onclick="$('dl').close()">Cerrar</button></div>`;$("dl").showModal()}
function fCobro(){$("dl").innerHTML=`<h2>Datos de cobro · ${SEDES[S].n}</h2><input id="cb" placeholder="Banco" value="${esc(cfg.banco)}"><input id="ca" placeholder="Alias" value="${esc(cfg.alias)}"><input id="cc" placeholder="CBU" value="${esc(cfg.cbu)}"><input id="ct" placeholder="Titular" value="${esc(cfg.titular)}"><div class="top"><button onclick="run(gCobro())">Guardar</button><button class="s" onclick="$('dl').close()">Cerrar</button></div>`;$("dl").showModal()}
async function gCobro(){await db.collection("amo_config").doc(S).set({banco:$("cb").value.trim(),alias:$("ca").value.trim(),cbu:$("cc").value.trim(),titular:$("ct").value.trim(),uid:OWNER});$("dl").close()}
/* ---- PÚBLICO ---- */
function paintPub(){const a=window._al;$("app").innerHTML=head(ag==1?"Agenda de turnos":"Inscripción",SEDES[S].n)+(a?`<div class="card top"><b>${esc(a.nombre)}</b><button class="x" onclick="window._al=null;paintPub()">No soy yo</button></div>${semNav()}`+grid(0,a)+`<div class="c"><small>Máx. ${a.plan==3?4:3} turnos por semana</small></div>`:`<div class="card" style="max-width:380px;margin:auto"><h2>Ingresá tu DNI</h2><input id="dni" type="number" placeholder="Ej: 35123456"><button style="width:100%" onclick="buscar()">Ver mis turnos</button></div>`)}
async function buscar(){const s=await db.collection("amo_pub_alumnos").where("sucursal","==",S).where("dni","==",$("dni").value.replace(/\D/g,"")).get();if(s.empty)return alert("DNI no encontrado. Consultá al estudio.");window._al={id:s.docs[0].id,...s.docs[0].data()};paintPub()}
function anotar(F,hk){const a=window._al,L=lunes(W),sem=res.filter(r=>r.alumnoId==a.id&&r.fecha>=fk(L)&&r.fecha<=fk(new Date(L.getTime()+6*864e5))).length;if(sem>=(a.plan==3?4:3))return alert("Llegaste al máximo de turnos de la semana. Cancelá uno para cambiar.");run(reservar(S,F,hk,a))}
function formIns(){const sd=SEDES[S],o=slots(S).map(s=>`<option>${s}</option>`).join("");$("app").innerHTML=head("Inscripción",sd.n)+`<div class="card" style="max-width:420px;margin:auto"><input id="in" placeholder="Nombre y apellido"><input id="it" placeholder="Teléfono"><input id="id" placeholder="DNI"><input id="ie" placeholder="Email"><select id="ip" onchange="cantH()"><option value="2">2 clases semanales — ${$$(sd.pl[2])}</option><option value="3">3 clases semanales — ${$$(sd.pl[3])}</option><option value="P">Clase de prueba — ${$$(sd.pl.P)}</option></select><div id="ih"></div><button style="width:100%" onclick="run(enviar())">Quiero inscribirme</button></div>`;window._o=o;cantH()}
function cantH(){const n=$("ip").value=="P"?1:+$("ip").value;$("ih").innerHTML=Array.from({length:n},()=>`<select class="ihs"><option value="">Elegí día y horario</option>${window._o}</select>`).join("")}
async function enviar(){const hs=[...document.querySelectorAll(".ihs")].map(s=>s.value).filter(Boolean),n=$("in").value.trim(),t=$("it").value.trim();if(!n||!t)throw"Completá nombre y teléfono";if(hs.length<document.querySelectorAll(".ihs").length||new Set(hs).size<hs.length)throw"Elegí todos los horarios (distintos)";
await db.collection("amo_prospectos").add({nombre:n,telefono:t,dni:$("id").value.replace(/\D/g,""),email:$("ie").value.trim(),plan:$("ip").value,horarios:hs,sucursal:S,estado:"nuevo",uid:OWNER,fecha:fk(new Date())});$("app").innerHTML=head("¡Inscripción recibida!","Gracias "+esc(n)+". Te contactamos para confirmar tu lugar 🤍")}
/* ---- ARRANQUE ---- */
if(params.get("agenda")||params.get("inscripcion")){ag=params.get("agenda")?1:2;const s=params.get("sede");
if(SEDES[s]){S=s;listen();ag==1?paintPub():formIns()}else $("app").innerHTML=head("Elegí tu sucursal")+sedeCards("pubSede");window.pubSede=k=>location.search="?"+(ag==1?"agenda":"inscripcion")+"=1&sede="+k}
else{$("app").innerHTML=head("AMO Pilates","Ingresá a tu sistema")+`<div class="card" style="max-width:360px;margin:auto"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Contraseña" onkeydown="if(event.key=='Enter')login()"><button style="width:100%" onclick="login()">Entrar</button><div id="er" style="color:#b44;margin-top:8px"></div></div>`;
au.onAuthStateChanged(u=>{if(u&&[OWNER,ADMIN2].includes(u.uid)){window._in=1;home()}else if(u){au.signOut()}else if(window._in)location.reload()})}
function login(){au.signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(()=>$("er").textContent="Email o contraseña incorrectos")}
</script></body></html>
